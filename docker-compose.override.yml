# Development override - adds Rails app and workers to the base services
# This file is automatically loaded by docker-compose alongside docker-compose.yml

---
version: "3"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      - RAILS_ENV=development
      - RAILS_DB_HOST=ptimedb
      - RAILS_DB_USERNAME=puzzletime
      - RAILS_DB_PASSWORD=timepuzzle
      - RAILS_DB_NAME=puzzletime_development
      - RAILS_MEMCACHED_HOST=ptimecache
      - RAILS_MEMCACHED_PORT=11211
      - AUTH_DB_ACTIVE=true
      - RAILS_LOG_TO_STDOUT=true
    depends_on:
      - ptimedb
      - ptimecache
    stdin_open: true
    tty: true

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/delayed_job run
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      - RAILS_ENV=development
      - RAILS_DB_HOST=ptimedb
      - RAILS_DB_USERNAME=puzzletime
      - RAILS_DB_PASSWORD=timepuzzle
      - RAILS_DB_NAME=puzzletime_development
      - RAILS_MEMCACHED_HOST=ptimecache
      - RAILS_MEMCACHED_PORT=11211
    depends_on:
      - ptimedb
      - ptimecache

  ptimecache:
    image: memcached:alpine
    ports:
      - "11211:11211"

volumes:
  bundle_cache:
