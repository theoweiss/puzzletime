# Local testing configuration - builds from source, runs in production mode
# but with RAILS_SESSION_SECURE=false to allow HTTP access

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_DB_HOST=db
      - RAILS_DB_USERNAME=${POSTGRES_USER:-puzzletime}
      - RAILS_DB_PASSWORD=${POSTGRES_PASSWORD}
      - RAILS_DB_NAME=${POSTGRES_DB:-puzzletime_production}
      - RAILS_MEMCACHED_HOST=cache
      - RAILS_MEMCACHED_PORT=11211
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - AUTH_DB_ACTIVE=true
      - RAILS_STORAGE_SERVICE=local
      # Allow HTTP for local testing (disable secure cookies)
      - RAILS_SESSION_SECURE=false
    volumes:
      - storage-data:/app-src/storage
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-puzzletime}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-puzzletime_production}
    volumes:
      - test-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puzzletime}"]
      interval: 5s
      timeout: 3s
      retries: 10

  cache:
    image: memcached:alpine
    restart: unless-stopped
    command: memcached -m 64
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  test-db-data:
  storage-data:
